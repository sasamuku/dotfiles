レビュー対象 (SQL, ORM DML, migration, DB 設計ドキュメント等) が存在しない場合は「対象なし」と報告して終了してよい。
出力フォーマットは、呼び出し元から指定があればそれに従い、なければ ~/.claude/skills/review-pr/output-format.md に従う。
詳細ルールは ~/.claude/skills/supabase-postgres-best-practices/references/ 配下を参照する。
"""
